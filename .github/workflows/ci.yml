name: CI Gate

on:
  push:
    branches:
      - main
      - feature/multimodal-v2
  pull_request:
    branches:
      - main
      - feature/multimodal-v2

jobs:
  verify:
    name: Typecheck, Build, & E2E Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium & OS Deps
        run: npx playwright install --with-deps chromium

      - name: Run Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run Production Build
        run: VITE_BASE=/ npm run build

      - name: Run Unit Tests & E2E Smoke Tests
        run: npm test
