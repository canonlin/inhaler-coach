name: CI Gate

on:
  push:
    branches:
      - main
      - feature/multimodal-v2
  pull_request:
    branches:
      - main
      - feature/multimodal-v2

jobs:
  verify:
    name: Lint, Typecheck, Build, Unit & DB Tests
    runs-on: ubuntu-latest

    # The API tests truncate between cases, so they need a database they own.
    # Without this service they silently skip and the gate passes on nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: inhaler
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/inhaler
      MRN_SALT: ci-salt-not-for-production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium & OS Deps
        run: bunx playwright install --with-deps chromium

      - name: Run Lint (biome, incl. complexity rules)
        run: bun run lint

      - name: Run Lint Budget (warnings may not grow)
        run: bun run lint:budget

      - name: Run Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Run Production Build
        run: VITE_BASE=/ bun run build

      - name: Apply Schema
        run: node scripts/migrate.mjs

      # The design rules used to be checked on one laptop only. The gate opens
      # the back office, so it needs the API and the dev server up; a check that
      # opens /admin without a session measures the sign-in form and reports
      # green on the wrong screen, so the session is created here.
      - name: Start the dev API and Vite for the design gate
        run: |
          PORT=4183 node scripts/dev-api.mjs > /tmp/dev-api.log 2>&1 &
          VITE_API_PROXY=http://localhost:4183 bunx vite --port 4185 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4183/api/health > /dev/null && \
               curl -sf http://localhost:4185/admin > /dev/null; then
              echo "servers up"; exit 0
            fi
            sleep 3
          done
          echo "the servers did not start:"; cat /tmp/dev-api.log /tmp/vite.log; exit 1

      - name: Run the Design Gate
        run: node output/design-review/design-gate.mjs

      - name: Run Unit Tests
        run: bun run test

      # Separate from `bun run test` because it needs the service above. If this
      # step is dropped the DB tests go back to skipping silently.
      - name: Run Database Integration Tests
        run: bun run test:db

      # e2e/video-lifecycle.spec.ts is deliberately NOT wired in. It drives real
      # YouTube embeds and asserts on video-end timing, so it depends on a third
      # party being up and fast. Running it here would make this gate red for
      # reasons that have nothing to do with the code. It needs a local video
      # fixture first; until then it is a manual check, and this job says so.
