<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <title>適倍樂（Spiolto Respimat）軟霧吸入器外觀示意圖</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F1F5F9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#bgGrad)" />

  <g filter="url(#shadow)" transform="translate(150, 15)">
    <!-- Top Cap (Folded/Hinged Cap) -->
    <rect x="15" y="10" width="70" height="50" rx="14" fill="#64748B" stroke="#334155" stroke-width="2" />
    <!-- Safety latch push button (Green) -->
    <rect x="30" y="45" width="40" height="15" rx="5" fill="#10B981" stroke="#047857" stroke-width="1.5" />
    <text x="50" y="56" font-family="sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">PUSH</text>

    <!-- Main White Cylindrical Body -->
    <rect x="10" y="58" width="80" height="100" rx="12" fill="url(#bodyGrad)" stroke="#94A3B8" stroke-width="2" />
    
    <!-- Dose Counter Circle -->
    <rect x="25" y="70" width="50" height="22" rx="4" fill="#0F172A" />
    <text x="50" y="85" font-family="monospace" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">60 PUFF</text>

    <!-- Brand Text -->
    <text x="50" y="112" font-family="sans-serif" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">SPIOLTO</text>
    <text x="50" y="126" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0D9488" text-anchor="middle">Respimat® 適倍樂</text>

    <!-- Middle Rotation Ridge -->
    <line x1="10" y1="158" x2="90" y2="158" stroke="#0D9488" stroke-width="3" />

    <!-- Transparent Lower Clear Base (Turn half a turn) -->
    <rect x="10" y="160" width="80" height="65" rx="10" fill="url(#transGrad)" stroke="#64748B" stroke-width="2" />
    <!-- Inner Aluminum Cartridge visible inside clear base -->
    <rect x="25" y="165" width="50" height="50" rx="6" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1" />
    <!-- Rotation Arrow -->
    <path d="M 30 195 Q 50 210 70 195" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" />
    <polygon points="70,190 75,198 65,198" fill="#0D9488" />
    <text x="50" y="218" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0D9488" text-anchor="middle">旋轉半圈 (轉開按)</text>
  </g>

  <!-- Spec Tag -->
  <rect x="16" y="16" width="100" height="24" rx="12" fill="#0D9488" />
  <text x="66" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SMI 軟霧吸入</text>
</svg>
