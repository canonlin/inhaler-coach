<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="40%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="canisterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#bgGrad)" />

  <g filter="url(#shadow)" transform="translate(130, 20) scale(0.65)">
    <!-- Top Metal Stem -->
    <rect x="55" y="25" width="90" height="35" rx="8" fill="#94A3B8" stroke="#475569" stroke-width="2" />
    <!-- White Canister Label with Purple Stripe -->
    <rect x="45" y="55" width="110" height="90" rx="12" fill="url(#canisterGrad)" stroke="#CBD5E1" stroke-width="2" />
    <rect x="55" y="75" width="90" height="25" rx="4" fill="#9333EA" />
    <text x="100" y="92" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">SERETIDE</text>
    <text x="100" y="115" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7E22CE" text-anchor="middle">Evohaler 125</text>
    <text x="100" y="132" font-family="sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">120 doses</text>

    <!-- Purple Plastic L-Actuator -->
    <path d="M 40 140 Q 40 130 50 130 L 150 130 Q 160 130 160 140 L 160 300 Q 160 315 145 315 L 50 315 Q 40 315 40 300 Z" fill="url(#purpleGrad)" />
    <!-- Mouthpiece -->
    <path d="M 80 230 L 235 230 Q 250 230 250 245 L 250 305 Q 250 315 235 315 L 80 315 Z" fill="url(#purpleGrad)" />

    <!-- Purple Mouthpiece Cap -->
    <rect x="170" y="235" width="85" height="80" rx="16" fill="#7E22CE" stroke="#581C87" stroke-width="2" />
    <circle cx="212" cy="275" r="22" fill="#581C87" />
    <text x="212" y="280" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">GSK</text>
  </g>

  <!-- Spec Tag -->
  <rect x="16" y="16" width="100" height="24" rx="12" fill="#7E22CE" />
  <text x="66" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MDI 定量噴霧</text>
</svg>
