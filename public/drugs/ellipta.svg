<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="yellowCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="elliptaBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#bgGrad)" />

  <g filter="url(#shadow)" transform="translate(110, 25)">
    <!-- Main Ellipta Rounded Disc Body -->
    <rect x="0" y="20" width="180" height="170" rx="45" fill="url(#elliptaBodyGrad)" stroke="#94A3B8" stroke-width="2.5" />

    <!-- Top curved edge contour -->
    <path d="M 25 35 Q 90 10 155 35" fill="none" stroke="#CBD5E1" stroke-width="3" />

    <!-- Dose Counter Window (Red & White box) -->
    <rect x="35" y="45" width="45" height="30" rx="6" fill="#DC2626" stroke="#991B1B" stroke-width="1.5" />
    <rect x="40" y="49" width="35" height="22" rx="3" fill="#FFFFFF" />
    <text x="57" y="65" font-family="monospace" font-size="14" font-weight="900" fill="#DC2626" text-anchor="middle">30</text>

    <!-- Air vent grid -->
    <g fill="#94A3B8">
      <circle cx="130" cy="50" r="3" />
      <circle cx="140" cy="50" r="3" />
      <circle cx="150" cy="50" r="3" />
      <circle cx="130" cy="60" r="3" />
      <circle cx="140" cy="60" r="3" />
      <circle cx="150" cy="60" r="3" />
    </g>

    <!-- Brand Label -->
    <text x="90" y="100" font-family="sans-serif" font-size="14" font-weight="900" fill="#334155" text-anchor="middle">RELVAR</text>
    <text x="90" y="115" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748B" text-anchor="middle">Ellipta® 易利達</text>

    <!-- Iconic Yellow Sliding Cover (half-open / closed presentation) -->
    <path d="M 0 105 Q 90 90 180 105 L 180 145 Q 180 190 135 190 L 45 190 Q 0 190 0 145 Z" fill="url(#yellowCoverGrad)" stroke="#A16207" stroke-width="2" />
    
    <!-- Grip Ribs on Yellow Cover -->
    <line x1="60" y1="135" x2="120" y2="135" stroke="#CA8A04" stroke-width="3" stroke-linecap="round" />
    <line x1="65" y1="145" x2="115" y2="145" stroke="#CA8A04" stroke-width="3" stroke-linecap="round" />
    <line x1="70" y1="155" x2="110" y2="155" stroke="#CA8A04" stroke-width="3" stroke-linecap="round" />

    <!-- Click Indicator -->
    <rect x="55" y="165" width="70" height="16" rx="8" fill="#FEF08A" stroke="#EAB308" stroke-width="1" />
    <text x="90" y="177" font-family="sans-serif" font-size="9" font-weight="bold" fill="#854D0E" text-anchor="middle">喀一聲備藥</text>
  </g>

  <!-- Spec Tag -->
  <rect x="16" y="16" width="100" height="24" rx="12" fill="#EAB308" />
  <text x="66" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#713F12" text-anchor="middle">DPI 乾粉吸入</text>
</svg>
