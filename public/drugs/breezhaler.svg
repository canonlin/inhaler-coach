<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <title>昂滋（Ultibro Breezhaler）微風吸入器外觀示意圖</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="mouthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#bgGrad)" />

  <g filter="url(#shadow)" transform="translate(110, 20)">
    <!-- Protective Cap / Base Outline -->
    <!-- Translucent Cyan Mouthpiece -->
    <path d="M 50 40 Q 90 20 130 40 L 135 90 L 45 90 Z" fill="url(#mouthGrad)" stroke="#0369A1" stroke-width="2" />
    <ellipse cx="90" cy="42" rx="25" ry="10" fill="#E0F2FE" />

    <!-- Left Piercing Button (Dark Blue) -->
    <rect x="10" y="115" width="28" height="45" rx="6" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" />
    <polygon points="26,132 20,137 26,142" fill="#FFFFFF" />

    <!-- Right Piercing Button (Dark Blue) -->
    <rect x="142" y="115" width="28" height="45" rx="6" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" />
    <polygon points="154,132 160,137 154,142" fill="#FFFFFF" />

    <!-- Main White Capsule Chamber Body -->
    <rect x="35" y="85" width="110" height="110" rx="16" fill="url(#bodyGrad)" stroke="#94A3B8" stroke-width="2" />

    <!-- Internal Capsule Chamber Preview (Transparent Oval) -->
    <rect x="65" y="105" width="50" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Yellow/Transparent Inhaled Capsule -->
    <rect x="73" y="111" width="34" height="14" rx="7" fill="#FACC15" stroke="#CA8A04" stroke-width="1" />

    <!-- Brand Typography -->
    <text x="90" y="152" font-family="sans-serif" font-size="12" font-weight="900" fill="#1E3A8A" text-anchor="middle">ULTIBRO</text>
    <text x="90" y="166" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0284C7" text-anchor="middle">Breezhaler® 昂滋</text>
    <text x="90" y="182" font-family="sans-serif" font-size="8" font-weight="bold" fill="#64748B" text-anchor="middle">雙側按壓刺孔 • 膠囊旋轉嗡嗡聲</text>
  </g>

  <!-- Spec Tag -->
  <rect x="16" y="16" width="100" height="24" rx="12" fill="#0284C7" />
  <text x="66" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DPI 膠囊乾粉</text>
</svg>
