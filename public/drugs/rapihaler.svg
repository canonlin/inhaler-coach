<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <title>都保噴霧（Symbicort Rapihaler）吸入器外觀示意圖</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="35%" stop-color="#E11D48" />
      <stop offset="90%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#bgGrad)" />

  <g filter="url(#shadow)" transform="translate(130, 20) scale(0.65)">
    <!-- Top Aluminum Canister -->
    <rect x="50" y="20" width="100" height="40" rx="10" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2" />
    <!-- White Upper Canister Body -->
    <rect x="40" y="55" width="120" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <rect x="55" y="85" width="90" height="30" rx="6" fill="#2563EB" />
    <text x="100" y="105" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">Rapihaler</text>
    <text x="100" y="78" font-family="sans-serif" font-size="14" font-weight="900" fill="#E11D48" text-anchor="middle">Symbicort</text>

    <!-- Main Red Actuator Body (L-Shape) -->
    <path d="M 35 150 Q 35 140 45 140 L 155 140 Q 165 140 165 150 L 165 310 Q 165 325 150 325 L 45 325 Q 35 325 35 310 Z" fill="url(#redGrad)" />
    <!-- Mouthpiece protrusion -->
    <path d="M 80 235 L 245 235 Q 260 235 260 250 L 260 315 Q 260 325 245 325 L 80 325 Z" fill="url(#redGrad)" />
    
    <!-- Grey Mouthpiece Cover -->
    <rect x="175" y="240" width="90" height="82" rx="16" fill="#94A3B8" stroke="#475569" stroke-width="2" />
    <circle cx="220" cy="281" r="24" fill="#FFFFFF" stroke="#E11D48" stroke-width="3" />
    <!-- Arrow -->
    <path d="M 206 281 L 216 273 L 216 278 L 228 278 L 228 273 L 234 281 L 228 289 L 228 284 L 216 284 L 216 289 Z" fill="#E11D48" />

    <!-- Dose Counter Window -->
    <circle cx="68" cy="185" r="18" fill="#1E293B" stroke="#E2E8F0" stroke-width="2" />
    <text x="68" y="191" font-family="monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">120</text>
  </g>

  <!-- Spec Tag -->
  <rect x="16" y="16" width="100" height="24" rx="12" fill="#E11D48" />
  <text x="66" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MDI 定量噴霧</text>
</svg>
