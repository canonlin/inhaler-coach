<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <!-- Soft 3D Lighting Gradients -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="30%" stop-color="#e11d48" />
      <stop offset="85%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="greyCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shadow3d)">
    <!-- Top Canister Rim -->
    <rect x="380" y="80" width="240" height="80" rx="25" fill="url(#metalGrad)" stroke="#475569" stroke-width="4" />

    <!-- Upper Sleeve -->
    <rect x="360" y="140" width="280" height="320" rx="35" fill="url(#greyCapGrad)" stroke="#475569" stroke-width="4" />

    <!-- Canister White & Blue Label -->
    <rect x="390" y="170" width="220" height="260" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
    
    <!-- Barcode Lines -->
    <path d="M410 190h6v30h-6zM422 190h3v30h-3zM430 190h8v30h-8zM442 190h4v30h-4zM450 190h10v30h-10zM465 190h3v30h-3zM472 190h8v30h-8zM485 190h5v30h-5zM495 190h8v30h-8zM508 190h4v30h-4zM515 190h10v30h-10zM530 190h6v30h-6zM540 190h4v30h-4zM550 190h8v30h-8zM562 190h5v30h-5zM572 190h8v30h-8z" fill="#0f172a" />

    <!-- Symbicort Logo & Subtitle -->
    <text x="500" y="260" font-family="sans-serif" font-size="28" font-weight="900" fill="#e11d48" text-anchor="middle">Symbicort®</text>
    <text x="500" y="285" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">budesonide/formoterol</text>

    <!-- Blue Rapihaler Box -->
    <rect x="410" y="300" width="180" height="60" rx="10" fill="#2563eb" />
    <text x="500" y="326" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">Rapihaler™</text>
    <text x="500" y="348" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">160/4.5 μg/dose</text>

    <text x="500" y="385" font-family="sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">120 doses</text>
    <text x="500" y="410" font-family="sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">AstraZeneca</text>

    <!-- Main Red L-Shaped Body Actuator -->
    <path d="M 340 430 Q 340 400 370 400 L 630 400 Q 660 400 660 430 L 660 880 Q 660 920 630 920 L 370 920 Q 340 920 340 880 Z" fill="url(#redGrad)" />
    <path d="M 460 700 L 860 700 Q 900 700 900 740 L 900 920 Q 900 960 860 960 L 460 960 Z" fill="url(#redGrad)" />

    <!-- Grey Mouthpiece Cap -->
    <rect x="640" y="720" width="280" height="260" rx="35" fill="url(#greyCapGrad)" stroke="#475569" stroke-width="5" />

    <!-- Cap Face Oval Sticker -->
    <ellipse cx="780" cy="850" rx="100" ry="100" fill="#ffffff" stroke="#e11d48" stroke-width="8" />
    <!-- Red Arrows -->
    <path d="M 710 850 L 750 820 L 750 840 L 810 840 L 810 820 L 850 850 L 810 880 L 810 860 L 750 860 L 750 880 Z" fill="#e11d48" />

    <!-- Dose Counter Window (120) -->
    <circle cx="420" cy="520" r="45" fill="#334155" stroke="#cbd5e1" stroke-width="4" />
    <text x="420" y="528" font-family="monospace" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">120</text>
  </g>
</svg>