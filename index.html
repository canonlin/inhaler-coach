<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吸必擴智慧教學平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
</head>
<body class="bg-bg text-text font-sans min-h-screen overflow-x-hidden before:fixed before:inset-0 before:z-0 before:pointer-events-none before:bg-[radial-gradient(ellipse_at_center,rgba(59,130,246,0.08)_0%,transparent_70%)]">

  <!-- LEFT SIDE PROGRESS PANEL -->
  <div class="hidden fixed left-0 top-0 bottom-0 w-[120px] z-[100] flex flex-col items-center justify-center bg-surface border-r border-border" id="side-progress">
    <div class="flex flex-col items-center" id="side-step-1">
      <div class="w-16 h-16 rounded-full border-[3px] border-danger bg-danger/10 flex items-center justify-center relative transition-all duration-300" id="side-dot-1">
        <span class="text-2xl">💊</span>
      </div>
      <div class="w-0.5 h-5 bg-border my-2 transition-all duration-300" id="side-line-1"></div>
      <div class="text-sm font-bold text-text-secondary">振搖</div>
    </div>
    <div class="flex flex-col items-center" id="side-step-2">
      <div class="w-16 h-16 rounded-full border-[3px] border-danger bg-danger/10 flex items-center justify-center relative transition-all duration-300" id="side-dot-2">
        <span class="text-2xl">💨</span>
      </div>
      <div class="w-0.5 h-5 bg-border my-2 transition-all duration-300" id="side-line-2"></div>
      <div class="text-sm font-bold text-text-secondary">吐氣</div>
    </div>
    <div class="flex flex-col items-center" id="side-step-3">
      <div class="w-16 h-16 rounded-full border-[3px] border-danger bg-danger/10 flex items-center justify-center relative transition-all duration-300" id="side-dot-3">
        <span class="text-2xl">🫁</span>
      </div>
      <div class="w-0.5 h-5 bg-border my-2 transition-all duration-300" id="side-line-3"></div>
      <div class="text-sm font-bold text-text-secondary">壓吸憋</div>
    </div>
    <div class="flex flex-col items-center" id="side-step-4">
      <div class="w-16 h-16 rounded-full border-[3px] border-danger bg-danger/10 flex items-center justify-center relative transition-all duration-300" id="side-dot-4">
        <span class="text-2xl">💧</span>
      </div>
      <div class="text-sm font-bold text-text-secondary mt-2">漱口</div>
    </div>
  </div>

  <!-- INTRO SCREEN -->
  <div class="screen hidden" id="screen-intro">
    <div class="w-full max-w-[640px] flex flex-col items-center text-center">
      <!-- 吸入器視覺錨點 -->
      <div id="intro-hero-img" class="mb-6 w-full flex justify-center"></div>

      <!-- 標題層級 -->
      <h1 class="text-[clamp(32px,6vw,48px)] font-black text-text leading-tight tracking-tight mb-2">吸必擴智慧教學</h1>
      <p class="text-text-secondary text-sm tracking-wide mb-8">Symbicort Rapihaler 吸藥闖關練習</p>

      <!-- 四步驟視覺預覽 -->
      <div class="grid grid-cols-4 gap-3 w-full mb-10">
        <div class="flex flex-col items-center gap-2 py-4 px-2 rounded-xl border border-danger/30 bg-danger/5">
          <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-black bg-danger/20 text-danger">1</div>
          <div class="text-2xl">💊</div>
          <div class="text-xs font-bold text-text">振搖</div>
        </div>
        <div class="flex flex-col items-center gap-2 py-4 px-2 rounded-xl border border-warning/30 bg-warning/5">
          <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-black bg-warning/20 text-warning">2</div>
          <div class="text-2xl">💨</div>
          <div class="text-xs font-bold text-text">吐氣</div>
        </div>
        <div class="flex flex-col items-center gap-2 py-4 px-2 rounded-xl border border-primary/30 bg-primary/5">
          <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-black bg-primary/20 text-primary">3</div>
          <div class="text-2xl">🫁</div>
          <div class="text-xs font-bold text-text">壓吸閉</div>
        </div>
        <div class="flex flex-col items-center gap-2 py-4 px-2 rounded-xl border border-success/30 bg-success/5">
          <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-black bg-success/20 text-success">4</div>
          <div class="text-2xl">💧</div>
          <div class="text-xs font-bold text-text">漱口</div>
        </div>
      </div>

      <!-- 唯一 CTA -->
      <button class="bg-primary hover:bg-primary-dark border-none text-white text-lg font-bold py-4 px-14 rounded-xl cursor-pointer transition-all duration-200 shadow-lg shadow-primary/20 hover:shadow-primary/40" id="btn-start">
        開始挑戰
      </button>

      <div id="patient-id-display" class="mt-8 text-xs text-text-secondary/40"></div>
    </div>
  </div>

  <!-- STAGE SCREEN -->
  <div class="fixed top-0 left-[120px] right-0 z-[99] px-5 py-3 bg-surface border-b border-border text-center text-base font-bold text-text hidden" id="stage-topbar"></div>
  <div class="screen hidden" id="screen-stage">
    <!-- one screen: 影片就是整個畫面，所有 UI 蓋在上面 -->
    <div class="relative w-full h-screen bg-black flex items-center justify-center overflow-hidden" id="stage-container">
      <!-- 影片居中保持比例 -->
      <div class="relative w-full h-full" id="video-section">
        <div class="absolute inset-0 flex items-center justify-center" id="video-iframe-wrap">
          <iframe id="video-iframe" class="w-full h-full border-none" style="max-width:100vw;max-height:100vh;aspect-ratio:16/9;" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <!-- 標題蓋在影片上 -->
        <div class="absolute top-0 left-0 right-0 z-10 text-center pt-4 pb-5 bg-gradient-to-b from-black/60 to-transparent" id="stage-header">
          <div class="inline-block px-4 py-1 rounded text-xs font-bold text-text-secondary mb-1" id="stage-badge">第一關</div>
          <div class="text-[clamp(24px,4vw,40px)] font-black text-text leading-tight" id="stage-title">振搖</div>
        </div>
        <div class="absolute top-16 left-1/2 -translate-x-1/2 z-10 w-full max-w-[480px] px-4 hidden" id="stage-hint-wrap">
          <div class="bg-warning/20 border border-warning/40 rounded-lg px-4 py-2 text-center text-sm text-warning" id="stage-hint"></div>
        </div>
        <!-- 影片標籤 -->
        <div class="absolute top-3 left-3 z-10 px-3 py-1 rounded bg-black/60 text-xs font-bold text-white/80" id="video-label-text">藥師示範影片</div>
        <!-- 按鈕：影片播完後居中出現（像播放鈕的位置） -->
        <div class="absolute inset-0 z-10 flex items-center justify-center pointer-events-none hidden" id="btn-try-wrap">
          <button class="px-8 py-4 rounded-xl border-none text-lg font-bold cursor-pointer transition-all duration-300 bg-success text-black shadow-2xl shadow-success/40 hover:scale-105 pointer-events-auto" id="btn-try">開始挑戰 →</button>
        </div>
        <!-- 其他按鈕蓋在影片右下 -->
        <div class="absolute bottom-3 right-3 z-10 flex items-center gap-2">
          <button class="px-5 py-2 rounded-lg border-none text-sm font-bold cursor-pointer transition-colors duration-200 bg-success text-white shadow-lg hidden" id="btn-pharmacist">藥師確認通過</button>
          <button class="px-5 py-2 rounded-lg border border-white/30 bg-white/10 text-white text-sm font-bold cursor-pointer transition-colors duration-200 hover:bg-white/20 hidden" id="btn-retry">再測一次</button>
          <button class="px-5 py-2 rounded-lg border-none text-sm font-bold cursor-pointer transition-colors duration-200 bg-primary text-white shadow-lg hidden" id="btn-next">進入下一關</button>
        </div>
        <!-- 狀態訊息蓋在影片下方 -->
        <div class="absolute bottom-14 left-1/2 -translate-x-1/2 z-10 w-full max-w-[500px] px-4 hidden" id="status-wrap">
          <div class="py-2 px-5 rounded-lg text-center text-sm font-bold border border-border bg-surface/90 text-text-secondary backdrop-blur-sm" id="status-box">等待操作中...</div>
        </div>
        <!-- 倒數計時居中 -->
        <div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none hidden" id="countdown-wrap">
          <div class="text-[80px] font-black text-center leading-none text-warning animate-countdown-pulse drop-shadow-lg" id="countdown-display">5</div>
        </div>
      </div>

      <!-- AI 偵測區：同樣 one screen -->
      <div class="absolute inset-0 bg-bg flex items-center justify-center hidden z-20" id="ai-section">
        <div class="w-full max-w-[800px] bg-surface border border-border rounded-xl overflow-hidden mx-4">
          <div class="px-5 py-3 text-sm font-bold text-text-secondary border-b border-border flex items-center gap-2">
            <span>AI 即時辨識</span>
            <span class="ml-auto text-xs text-text-secondary/60" id="ai-model-label">模型載入中...</span>
          </div>
          <div class="p-5 flex gap-5 items-start flex-wrap max-md:flex-col">
            <div class="relative w-[clamp(280px,40vw,480px)] min-w-[260px] flex-shrink-0">
              <canvas id="webcam-canvas" class="w-full h-auto rounded-lg bg-black block border border-border min-h-[200px]" width="480" height="360"></canvas>
              <div class="absolute inset-0 rounded-lg pointer-events-none border-2 border-transparent transition-all duration-300" id="webcam-overlay"></div>
            </div>
            <div class="flex-1 min-w-[180px] flex flex-col gap-3" id="ai-results">
              <div class="text-sm text-text-secondary text-center p-5">AI 模型載入中，請稍候...</div>
            </div>
          </div>
          <div class="px-4 py-2 border-t border-border text-left">
            <button id="btn-back-video" class="bg-none border-none text-text-secondary text-xs cursor-pointer font-sans hover:text-text">← 重新觀看影片</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SUCCESS SCREEN -->
  <div class="screen hidden" id="screen-success">
    <div class="max-w-[480px] flex flex-col items-center gap-6">
      <div class="text-5xl mb-2 animate-slide-up">✅</div>
      <h1 class="text-[clamp(28px,5vw,40px)] font-black text-text animate-slide-up">恭喜通關成功</h1>
      <p class="text-text-secondary text-base animate-slide-up">您已學會正確的吸藥方式</p>
      <div class="bg-surface border border-border rounded-xl px-8 py-6 w-full animate-slide-up">
        <div class="text-xs text-primary font-bold tracking-widest mb-3">記住口訣</div>
        <div class="text-[clamp(20px,3.5vw,28px)] font-black text-text tracking-wider">搖・吐・壓吸閉・漱</div>
      </div>
      <div class="flex gap-3 justify-center flex-wrap animate-slide-up">
        <div class="bg-success/10 border border-success/30 rounded-lg px-4 py-2 text-sm font-bold text-success">✓ 振搖</div>
        <div class="bg-success/10 border border-success/30 rounded-lg px-4 py-2 text-sm font-bold text-success">✓ 吐氣</div>
        <div class="bg-success/10 border border-success/30 rounded-lg px-4 py-2 text-sm font-bold text-success">✓ 壓吸憋</div>
        <div class="bg-success/10 border border-success/30 rounded-lg px-4 py-2 text-sm font-bold text-success">✓ 漱口</div>
      </div>
      <p class="text-sm text-text-secondary">每天照這樣做，藥師隨時為您服務</p>
      <button class="px-8 py-3 rounded-lg border border-border bg-surface text-text text-base font-bold cursor-pointer transition-colors duration-200 hover:border-primary hover:text-primary" id="btn-restart">再練習一次</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
